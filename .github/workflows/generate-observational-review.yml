name: Generate Observational Review

on:
  workflow_dispatch:
    inputs:
      envelope_path:
        description: Path to a committed observation envelope
        required: true
        default: observations/manual-envelope.json
      publish_issue:
        description: Open a review issue after validation
        required: true
        type: boolean
        default: true
  repository_dispatch:
    types: [observation-ready]

permissions:
  contents: read
  issues: write

concurrency:
  group: observational-review-${{ github.event.client_payload.repository || inputs.envelope_path || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Resolve observation envelope
        id: envelope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENVELOPE: ${{ toJson(github.event.client_payload.envelope) }}
          MANUAL_PATH: ${{ inputs.envelope_path }}
        run: |
          mkdir -p .review-input
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s\n' "$DISPATCH_ENVELOPE" > .review-input/envelope.json
          else
            cp "$MANUAL_PATH" .review-input/envelope.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          envelope = json.loads(Path('.review-input/envelope.json').read_text())
          print(f"repository={envelope['repository']}")
          print(f"revision={envelope['revision']}")
          with Path('/tmp/review-meta').open('w') as out:
              out.write(f"repository={envelope['repository']}\n")
              out.write(f"revision={envelope['revision']}\n")
          PY
          cat /tmp/review-meta >> "$GITHUB_OUTPUT"

      - name: Validate observation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path('schemas/observation-envelope.schema.json').read_text())
          data = json.loads(Path('.review-input/envelope.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)
          PY

      - name: Generate decision review
        run: python scripts/generate_review.py --input .review-input/envelope.json --output-dir review-output

      - name: Validate decision review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path('schemas/decision-review.schema.json').read_text())
          data = json.loads(Path('review-output/decision-review.json').read_text())
          Draft202012Validator(schema).validate(data)
          PY

      - name: Publish review summary
        run: cat review-output/REVIEW.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain review package
        uses: actions/upload-artifact@v4
        with:
          name: decision-review-${{ github.run_id }}
          path: review-output/
          if-no-files-found: error
          retention-days: 90

      - name: Open human review issue
        if: ${{ github.event_name == 'repository_dispatch' || inputs.publish_issue }}
        uses: actions/github-script@v7
        env:
          SUBJECT_REPOSITORY: ${{ steps.envelope.outputs.repository }}
          SUBJECT_REVISION: ${{ steps.envelope.outputs.revision }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-output/REVIEW.md', 'utf8');
            const title = `Decision review: ${process.env.SUBJECT_REPOSITORY}@${process.env.SUBJECT_REVISION.slice(0, 12)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `${body}\n\n---\nGenerated by workflow run ${context.runId}. The full validated package is retained as a workflow artifact.`,
              assignees: ['qt314wink']
            });
