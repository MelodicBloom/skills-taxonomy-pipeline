name: Validate Decision Review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate schema itself
        run: python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open('schemas/decision-review.schema.json', encoding='utf-8') as f:
              schema = json.load(f)
          Draft202012Validator.check_schema(schema)
          print('Decision review schema is valid.')
          PY
      - name: Validate review fixtures when present
        run: |
          python - <<'PY'
          import glob, json, sys
          from jsonschema import Draft202012Validator
          with open('schemas/decision-review.schema.json', encoding='utf-8') as f:
              validator = Draft202012Validator(json.load(f))
          files = glob.glob('reviews/**/*.json', recursive=True)
          for path in files:
              with open(path, encoding='utf-8') as f:
                  instance = json.load(f)
              errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.path))
              if errors:
                  for error in errors:
                      print(f'{path}: {list(error.path)}: {error.message}')
                  sys.exit(1)
          print(f'Validated {len(files)} review artifact(s).')
          PY